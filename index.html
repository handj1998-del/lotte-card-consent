<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>롯데렌터카 카드 동의서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    .signature-pad { border: 2px dashed #cbd5e1; border-radius: 12px; background: #fff; touch-action: none; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto">
    <header class="bg-red-600 text-white p-4 flex flex-wrap justify-between items-center gap-2">
      <div>
        <h1 class="text-lg font-bold">LOTTE rent-a-car · 김해공항</h1>
        <p class="text-xs opacity-90">카드 정보 수집 동의서</p>
      </div>
      <div class="flex gap-2">
        <button id="btnForm" class="bg-white text-red-600 px-4 py-2 rounded-lg text-sm font-medium">작성</button>
        <button id="btnList" class="bg-white/20 px-4 py-2 rounded-lg text-sm font-medium">목록·다운로드</button>
      </div>
    </header>

    <!-- Form -->
    <div id="formView" class="p-4 max-w-md mx-auto">
      <div class="bg-white rounded-2xl p-5 space-y-3 shadow">
        <input id="name" type="text" placeholder="고객명 *" class="w-full border rounded-lg px-4 py-3 text-base">
        <input id="reservation" type="text" placeholder="예약번호" class="w-full border rounded-lg px-4 py-3 text-base">
        <input id="phone" type="tel" placeholder="연락처" class="w-full border rounded-lg px-4 py-3 text-base">
        <input id="email" type="email" placeholder="이메일" class="w-full border rounded-lg px-4 py-3 text-base">
        <div class="relative">
          <input id="cardNumber" type="text" placeholder="카드번호" class="w-full border rounded-lg px-4 py-3 pr-20 text-base">
          <button id="scanBtn" type="button" class="absolute right-2 top-1/2 -translate-y-1/2 bg-blue-600 text-white text-xs px-3 py-1.5 rounded">스캔</button>
        </div>
        <input id="expiry" type="text" placeholder="만료일 MM/YYYY" class="w-full border rounded-lg px-4 py-3 text-base">
        <input id="issuer" type="text" placeholder="카드사" class="w-full border rounded-lg px-4 py-3 text-base">
        <select id="cardType" class="w-full border rounded-lg px-4 py-3 text-base bg-white">
          <option value="">카드 종류</option>
          <option>Credit</option>
          <option>Debit</option>
        </select>
        <div>
          <p class="text-sm text-gray-600 mb-1">서명 *</p>
          <canvas id="signature" class="signature-pad w-full h-40"></canvas>
          <button type="button" id="clearSign" class="text-sm text-red-600 mt-1">지우기</button>
        </div>
        <button id="submitBtn" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold text-lg mt-2">저장</button>
      </div>
    </div>

    <!-- List -->
    <div id="listView" class="hidden p-4">
      <div class="bg-white rounded-2xl shadow overflow-hidden">
        <div class="p-4 flex justify-between items-center border-b">
          <h2 class="font-bold">저장된 동의서</h2>
          <div class="flex gap-2">
            <button id="downloadBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm">CSV 다운로드</button>
            <button id="clearAllBtn" class="bg-gray-500 text-white px-3 py-2 rounded-lg text-sm">전체 삭제</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-left">
              <tr>
                <th class="p-3">시간</th>
                <th class="p-3">고객명</th>
                <th class="p-3">예약번호</th>
                <th class="p-3">연락처</th>
                <th class="p-3">카드번호</th>
                <th class="p-3">만료일</th>
                <th class="p-3">서명</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <p id="empty" class="p-10 text-center text-gray-500 hidden">저장된 데이터가 없습니다.</p>
      </div>
    </div>
  </div>

  <!-- Camera Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-4 w-full max-w-sm">
      <video id="video" class="w-full rounded-lg" autoplay playsinline></video>
      <canvas id="camCanvas" class="hidden"></canvas>
      <div class="flex gap-2 mt-3">
        <button id="capture" class="flex-1 bg-blue-600 text-white py-3 rounded-lg">촬영</button>
        <button id="closeModal" class="flex-1 bg-gray-200 py-3 rounded-lg">닫기</button>
      </div>
      <p id="ocrStatus" class="text-center text-sm mt-2"></p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'lotte_card_consents';

    const canvas = document.getElementById('signature');
    const pad = new SignaturePad(canvas, { backgroundColor: '#ffffff' });
    function resize() {
      const r = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * r;
      canvas.height = canvas.offsetHeight * r;
      canvas.getContext('2d').scale(r, r);
      pad.clear();
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 150);
    document.getElementById('clearSign').onclick = () => pad.clear();

    document.getElementById('btnForm').onclick = () => {
      document.getElementById('formView').classList.remove('hidden');
      document.getElementById('listView').classList.add('hidden');
    };
    document.getElementById('btnList').onclick = () => {
      document.getElementById('formView').classList.add('hidden');
      document.getElementById('listView').classList.remove('hidden');
      loadList();
    };

    let stream;
    document.getElementById('scanBtn').onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        document.getElementById('video').srcObject = stream;
        document.getElementById('modal').classList.remove('hidden');
      } catch { alert('카메라 권한을 허용해 주세요'); }
    };
    document.getElementById('closeModal').onclick = () => {
      if (stream) stream.getTracks().forEach(t => t.stop());
      document.getElementById('modal').classList.add('hidden');
    };
    document.getElementById('capture').onclick = async () => {
      const video = document.getElementById('video');
      const canvas = document.getElementById('camCanvas');
      const status = document.getElementById('ocrStatus');
      status.textContent = '인식 중...';
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      try {
        const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
        const num = (text.match(/(?:\d[ -]*){13,19}/) || [''])[0].replace(/\D/g, '');
        const exp = text.match(/(0[1-9]|1[0-2])\s*[\/\-]\s*(\d{2,4})/);
        if (num.length >= 13) document.getElementById('cardNumber').value = num;
        if (exp) document.getElementById('expiry').value = exp[1] + '/' + (exp[2].length === 2 ? '20' + exp[2] : exp[2]);
        status.textContent = '완료';
        setTimeout(() => document.getElementById('closeModal').click(), 700);
      } catch { status.textContent = '실패'; }
    };

    function getData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch { return []; }
    }
    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    document.getElementById('submitBtn').onclick = () => {
      const name = document.getElementById('name').value.trim();
      if (!name) return alert('고객명을 입력해 주세요');
      if (pad.isEmpty()) return alert('서명을 해 주세요');

      const item = {
        timestamp: new Date().toISOString(),
        renterName: name,
        reservationNo: document.getElementById('reservation').value,
        contactNo: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        cardNumber: document.getElementById('cardNumber').value,
        expirationDate: document.getElementById('expiry').value,
        cardIssuer: document.getElementById('issuer').value,
        cardType: document.getElementById('cardType').value,
        signature: pad.toDataURL()
      };

      const data = getData();
      data.unshift(item);
      saveData(data);

      alert('저장되었습니다');
      document.querySelectorAll('#formView input, #formView select').forEach(el => el.value = '');
      pad.clear();
    };

    function loadList() {
      const data = getData();
      const tbody = document.getElementById('listBody');
      const empty = document.getElementById('empty');
      if (!data.length) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      tbody.innerHTML = data.map(item => `
        <tr class="border-t hover:bg-gray-50">
          <td class="p-3 whitespace-nowrap">${new Date(item.timestamp).toLocaleString('ko-KR')}</td>
          <td class="p-3">${item.renterName || '-'}</td>
          <td class="p-3">${item.reservationNo || '-'}</td>
          <td class="p-3">${item.contactNo || '-'}</td>
          <td class="p-3 font-mono text-xs">${item.cardNumber || '-'}</td>
          <td class="p-3">${item.expirationDate || '-'}</td>
          <td class="p-3">${item.signature ? `<img src="${item.signature}" class="h-10 border rounded">` : '-'}</td>
        </tr>`).join('');
    }

    document.getElementById('downloadBtn').onclick = () => {
      const data = getData();
      if (!data.length) return alert('데이터가 없습니다');
      const headers = ['시간','고객명','예약번호','연락처','이메일','카드번호','만료일','카드사','카드종류'];
      const rows = data.map(i => [
        new Date(i.timestamp).toLocaleString('ko-KR'),
        i.renterName || '', i.reservationNo || '', i.contactNo || '', i.email || '',
        i.cardNumber || '', i.expirationDate || '', i.cardIssuer || '', i.cardType || ''
      ]);
      const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }));
      a.download = `카드동의서_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    };

    document.getElementById('clearAllBtn').onclick = () => {
      if (confirm('저장된 모든 데이터를 삭제하시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        loadList();
      }
    };

    // Load list if already on that tab (for refresh)
    if (!document.getElementById('listView').classList.contains('hidden')) loadList();
  </script>
</body>
</html>
