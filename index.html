<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>롯데렌터카 카드 동의서</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .signature-pad { border: 2px dashed #cbd5e1; border-radius: 8px; background: #fff; touch-action: none; }
    @media print { .no-print { display: none !important; } }
    .form-preview { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; background: white; padding: 20px; font-size: 10px; line-height: 1.3; }
    .form-preview h1 { text-align: center; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
    .form-preview table { width: 100%; border-collapse: collapse; margin: 6px 0; }
    .form-preview td { border: 1px solid #666; padding: 4px 5px; }
    .form-preview .label { background: #f0f0f0; font-weight: bold; width: 30%; }
    .section-title { background: #e0e0e0; padding: 3px 5px; font-weight: bold; margin: 8px 0 4px 0; }
  </style>
</head>
<body class="bg-gray-100">
  <div class="bg-red-600 text-white p-3 flex justify-end sticky top-0 z-10 no-print">
    <button id="refreshBtn" class="bg-white/20 px-4 py-2 rounded-lg text-sm font-medium">새로고침</button>
  </div>
  <div class="max-w-md mx-auto p-4 no-print">
    <header class="bg-red-600 text-white p-4 rounded-t-xl">
      <h1 class="text-lg font-bold">LOTTE rent-a-car · 김해공항</h1>
      <p class="text-xs opacity-90">카드 정보 수집 동의서</p>
      <p class="text-xs opacity-75 mt-1">v1.0</p>
    </header>
    <div class="bg-white p-5 space-y-3 rounded-b-xl shadow">
      <input id="reservation" type="text" placeholder="예약번호" class="w-full border rounded-lg px-4 py-3">
      <input id="name" type="text" placeholder="고객명 *" class="w-full border rounded-lg px-4 py-3">
      <input id="email" type="email" placeholder="이메일" class="w-full border rounded-lg px-4 py-3">
      <input id="phone" type="tel" placeholder="연락처" class="w-full border rounded-lg px-4 py-3">
      <select id="cardType" class="w-full border rounded-lg px-4 py-3 bg-white">
        <option value="">카드 종류 (Debit / Credit)</option>
        <option>Debit</option>
        <option>Credit</option>
      </select>
      <input id="issuer" type="text" placeholder="카드사" class="w-full border rounded-lg px-4 py-3">
      <input id="cardNumber" type="text" placeholder="카드번호" class="w-full border rounded-lg px-4 py-3" maxlength="19">
      <input id="expiry" type="text" placeholder="만료일 MM/YY" class="w-full border rounded-lg px-4 py-3" maxlength="5">
      <div>
        <p class="text-sm text-gray-600 mb-1">서명 *</p>
        <canvas id="signature" class="signature-pad w-full h-32"></canvas>
        <button type="button" id="clearSign" class="text-sm text-red-600 mt-1">지우기</button>
      </div>
      <label class="flex items-start gap-2 text-xs">
        <input type="checkbox" id="agree" class="mt-1">
        <span>개인정보 수집 및 이용에 동의합니다.</span>
      </label>
      <button id="previewBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">미리보기</button>
      <button id="pdfBtn" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold">PDF 저장</button>
    </div>
  </div>
  <div id="previewArea" class="hidden p-4">
    <div id="printForm" class="form-preview"></div>
    <div class="no-print text-center mt-4">
      <button id="backBtn" class="bg-gray-500 text-white px-6 py-3 rounded-lg">돌아가기</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('signature');
    const pad = new SignaturePad(canvas, { backgroundColor: '#ffffff' });
    function resize() {
      const r = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * r;
      canvas.height = canvas.offsetHeight * r;
      canvas.getContext('2d').scale(r, r);
      pad.clear();
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 100);
    document.getElementById('clearSign').onclick = () => pad.clear();
    document.getElementById('refreshBtn').onclick = () => {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="animate-spin inline-block">⟳</span> 로딩중...';
      setTimeout(() => location.reload(true), 300);
    };
    document.getElementById('cardNumber').addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 16);
      e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
    });
    document.getElementById('expiry').addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 4);
      if (v.length >= 2) v = v.slice(0,2) + '/' + v.slice(2);
      e.target.value = v;
    });
    function getFormData() {
      return {
        reservationNo: document.getElementById('reservation').value,
        renterName: document.getElementById('name').value,
        email: document.getElementById('email').value,
        contactNo: document.getElementById('phone').value,
        cardType: document.getElementById('cardType').value,
        cardIssuer: document.getElementById('issuer').value,
        cardNumber: document.getElementById('cardNumber').value,
        expirationDate: document.getElementById('expiry').value,
        signature: pad.isEmpty() ? '' : pad.toDataURL(),
        date: new Date().toLocaleDateString('en-CA')
      };
    }
    function generateFormHTML(d) {
      return `<h1>Consent to the Collection and Use of Credit / Debit Card Information</h1><table><tr><td class="label">Company</td><td>Lotte Rental Co., Ltd.</td><td class="label">Type</td><td>${d.cardType || ''}</td></tr><tr><td class="label">Reservation No.</td><td>${d.reservationNo || ''}</td><td class="label">Card Issuer</td><td>${d.cardIssuer || ''}</td></tr><tr><td class="label">Renter's Name</td><td>${d.renterName || ''}</td><td class="label">Card Number</td><td>${d.cardNumber || ''}</td></tr><tr><td class="label">Contact (e-mail)</td><td>${d.email || ''}</td><td class="label">Expiration Date</td><td>${d.expirationDate || ''}</td></tr><tr><td class="label">Contact No.</td><td colspan="3">${d.contactNo || ''}</td></tr></table><p style="font-size:9px;margin:4px 0;">* Only the payment card owned by the renter/driver shall be eligible for registration.</p><div class="section-title">Purpose of Collection and Use of Personal Information</div><p>Lotte Rental Co., Ltd. ("the Company") hereby informs the renter of the purposes for which your personal information is collected and used:</p><p>■ Extra Rental Charges: For costs due to renting the car longer than planned.</p><p>■ Damage Fees: For paying any damage to the car, unless covered by a full damage waiver.</p><p>■ Traffic Fines: For any tickets for speeding, traffic laws, parking illegally, or using disabled parking without permission.</p><p>■ Toll Fees: For tolls on highways and roads used during the rental.</p><p>■ Recovery Fees: For clearing cause from renter's prohibited conduct (e.g. smoking).</p><div class="section-title">Items of Personal Information to be Collected and Used</div><p>Renter's name / Renter's Contact Information (phone number, email address, etc) / Reservation number / Card type / Card issuer / Card number / Card expiration date</p><div class="section-title">Period of Retention</div><p>The collected personal information will be retained for a period of 90 days following the return of the rental vehicle. Upon the expiration of this period, all personal information will be securely destroyed.</p><div class="section-title">Settlement</div><p>■ Notification: The renter shall receive notification through the provided email address or phone number, detailing the charges incurred.</p><p>■ Payment Execution: With the notification, the company shall proceed the payment utilizing the debit/credit card information provided by the renter.</p><div class="section-title">Consent and Rights</div><p>You, as the renter, have the right to refuse Consent to the Collection and Use of Personal Information as outlined above. However, please be advised that refusal to provide consent may result in limitations to the services that the Company can provide to you.</p><p>By signing, the renter confirms understanding and agreement to the collection and use of personal information by the Company as described.</p><div class="section-title">Acknowledgment and Consent</div><p>I, <strong>${d.renterName || ''}</strong>, hereby acknowledge that I have read and understood the above information regarding the collection and use of my personal information by Lotte Rental Co., Ltd. I provide my consent freely and without coercion for the collection and use of my personal information as described.</p><div style="display:flex;justify-content:space-between;margin-top:12px;align-items:flex-end;"><div><p style="margin-bottom:2px;">Signature</p>${d.signature ? `<img src="${d.signature}" style="height:45px;border:1px solid #ccc;">` : '<div style="height:45px;width:160px;border:1px solid #ccc;"></div>'}</div><div style="text-align:right;"><p>Date</p><p>${d.date}</p></div></div>`;
    }
    document.getElementById('previewBtn').onclick = () => {
      const name = document.getElementById('name').value.trim();
      if (!name) return alert('고객명을 입력해 주세요');
      if (!document.getElementById('agree').checked) return alert('동의해 주세요');
      document.querySelector('.max-w-md').classList.add('hidden');
      document.getElementById('previewArea').classList.remove('hidden');
      document.getElementById('printForm').innerHTML = generateFormHTML(getFormData());
    };
    document.getElementById('backBtn').onclick = () => {
      document.querySelector('.max-w-md').classList.remove('hidden');
      document.getElementById('previewArea').classList.add('hidden');
    };
    document.getElementById('pdfBtn').onclick = () => {
      const name = document.getElementById('name').value.trim();
      if (!name) return alert('고객명을 입력해 주세요');
      if (!document.getElementById('agree').checked) return alert('동의해 주세요');
      document.querySelector('.max-w-md').classList.add('hidden');
      document.getElementById('previewArea').classList.remove('hidden');
      document.getElementById('printForm').innerHTML = generateFormHTML(getFormData());
      setTimeout(() => {
        html2pdf().set({
          margin: 8,
          filename: `카드동의서_${name}_${new Date().toISOString().slice(0,10)}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).from(document.getElementById('printForm')).save().then(() => {
          document.querySelector('.max-w-md').classList.remove('hidden');
          document.getElementById('previewArea').classList.add('hidden');
        });
      }, 200);
    };
  </script>
</body>
</html>
